name: Build XAU Strategy Researcher v2.1.1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build complete v2.1.1
        run: python3 .github/scripts/build_xau_v211.py

      - name: Validate generated source
        run: |
          test -f XAU_Strategy_Researcher_Pro_v2.1.1.py
          lines=$(wc -l < XAU_Strategy_Researcher_Pro_v2.1.1.py)
          echo "Generated Python lines: $lines"
          test "$lines" -ge 1000
          python3 -m py_compile XAU_Strategy_Researcher_Pro_v2.1.1.py

      - name: Create Python 3.12 BAT launcher
        shell: bash
        run: |
          cat > Run_XAU_Strategy_Researcher_Pro_v2.1.1.bat <<'BAT'
          @echo off
          setlocal
          cd /d "%~dp0"
          title XAU Strategy Researcher Pro v2.1.1
          echo ============================================================
          echo       XAU STRATEGY RESEARCHER PRO v2.1.1
          echo ============================================================
          echo.
          echo [INFO] Checking Python 3.12...
          py -3.12 --version >nul 2>nul
          if errorlevel 1 goto PYTHON_FALLBACK
          set "PYTHON_EXE=py -3.12"
          goto RUN
          :PYTHON_FALLBACK
          if exist "%LocalAppData%\Programs\Python\Python312\python.exe" (
              set "PYTHON_EXE=%LocalAppData%\Programs\Python\Python312\python.exe"
              goto RUN
          )
          echo [ERROR] Python 3.12 was not found.
          py -0p
          pause
          exit /b 1
          :RUN
          %PYTHON_EXE% --version
          %PYTHON_EXE% -c "import MetaTrader5, pandas, numpy; print('[OK] Required packages available.')"
          if errorlevel 1 (
              echo [INFO] Installing required packages...
              %PYTHON_EXE% -m pip install MetaTrader5 pandas numpy
              if errorlevel 1 (
                  echo [ERROR] Package installation failed.
                  pause
                  exit /b 1
              )
          )
          if not exist "XAU_Strategy_Researcher_Pro_v2.1.1.py" (
              echo [ERROR] Application file not found.
              pause
              exit /b 1
          )
          echo [INFO] Starting research-only application...
          %PYTHON_EXE% "XAU_Strategy_Researcher_Pro_v2.1.1.py"
          pause
          BAT

      - name: Validate BAT and commit generated files
        run: |
          test -f Run_XAU_Strategy_Researcher_Pro_v2.1.1.bat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add XAU_Strategy_Researcher_Pro_v2.1.1.py Run_XAU_Strategy_Researcher_Pro_v2.1.1.bat
          git diff --cached --quiet && echo "No generated changes." || git commit -m "Build complete XAU Strategy Researcher v2.1.1"
          git push origin HEAD:feature/xau-researcher-v2.1.1-data-loader
