name: Build XAU Strategy Researcher v2.1.1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build complete v2.1.1
        run: python3 .github/scripts/build_xau_v211.py

      - name: Validate generated source
        run: |
          test -f XAU_Strategy_Researcher_Pro_v2.1.1.py
          lines=$(wc -l < XAU_Strategy_Researcher_Pro_v2.1.1.py)
          echo "Generated Python lines: $lines"
          test "$lines" -ge 1000
          python3 -m py_compile XAU_Strategy_Researcher_Pro_v2.1.1.py

      - name: Create Python 3.12 BAT launcher
        run: python3 .github/scripts/create_xau_bat.py

      - name: Validate BAT and commit generated files
        run: |
          test -f Run_XAU_Strategy_Researcher_Pro_v2.1.1.bat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add XAU_Strategy_Researcher_Pro_v2.1.1.py Run_XAU_Strategy_Researcher_Pro_v2.1.1.bat
          git diff --cached --quiet && echo "No generated changes." || git commit -m "Build complete XAU Strategy Researcher v2.1.1"
          git push origin HEAD:feature/xau-researcher-v2.1.1-data-loader
