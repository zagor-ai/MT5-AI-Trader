name: Validate XAU Strategy Researcher v2.1.1

on:
  workflow_dispatch:
  push:
    paths:
      - "*.py"
      - "core/**"
      - "gui/**"
      - "services/**"
      - "validation/**"
      - "requirements.txt"
      - ".github/workflows/build-xau-researcher-v2-1-1.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Validate project structure
        shell: bash
        run: |
          set -e
          test -f app.py
          test -f XAU_Strategy_Researcher_Pro_v2.1.py
          test -f core/research_engine.py
          test -f services/mt5_connector.py
          test -f gui/main_window.py
          test -f validation/monte_carlo.py
          test -f validation/parameter_sensitivity.py
          test -f validation/market_regime.py
          test -f requirements.txt

      - name: Compile all Python modules
        shell: bash
        run: |
          set -e
          python -m compileall -q app.py XAU_Strategy_Researcher_Pro_v2.1.py core gui services validation

      - name: Import smoke test
        shell: bash
        run: |
          set -e
          python - <<'PY'
          import app
          from core.research_engine import ResearchEngine, ResearchConfig
          from services.mt5_connector import MT5Connector
          from validation.monte_carlo import MonteCarloSimulator, MonteCarloConfig
          from validation.parameter_sensitivity import ParameterSensitivity, SensitivityConfig
          from validation.market_regime import detect_regimes
          print("Import smoke test: OK")
          print("Candidates:", ResearchConfig().max_candidates)
          print("MT5 connector: OK")
          print("Validation engines: OK")
          PY

      - name: Check launcher
        shell: bash
        run: |
          set -e
          test -f Run_XAU_Strategy_Researcher_Pro_v2.1.bat
          grep -q "py -3.12" Run_XAU_Strategy_Researcher_Pro_v2.1.bat
          echo "Launcher check: OK"
